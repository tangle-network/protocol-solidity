name: Publish Docs

on:
  push:
    branches:
      - main
    # Only publish when changes are made to the following paths
    paths:
      - 'packages/**'
      - 'circuits/**'

  pull_request:
    branches:
      - main
    # Only publish when changes are made to the following paths
    paths:
      - 'packages/**'
      - 'circuits/**'

jobs:
  publish-docs:
    if: github.event_name == 'push' && github.event.ref == 'refs/heads/main'
    name: Publish Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.2

      - name: Initialize submodules
        run: git submodule update --init --recursive
      - run: yarn fetch:fixtures
      - run: yarn install --production=false
      - run: yarn compile
      - run: yarn build:packages
      - run: cd ./packages/protocol-solidity && yarn install
      - name: Generate docs
        run: |
          cd ./packages/protocol-solidity && npx typedoc --out docs src/index.ts 
  
      - name: Deploy docs 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: gh-pages
          folder: ./packages/protocol-solidity/docs
